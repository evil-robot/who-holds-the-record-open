"62.0" y="82.0" font-size="9.9" fill="#374151">only with consent</text><text x="0.0" y="168.0" font-size="10.2" fill="#111827" font-weight="600">No country met this anchor</text><text x="0.0" y="180.0" font-size="10.2" fill="#111827" font-weight="600">on 2 October 2026.</text><text x="0.0" y="192.0" font-size="10.2" fill="#374151" font-weight="400">The person holds or directs</text><text x="0.0" y="204.0" font-size="10.2" fill="#374151" font-weight="400">the record. Nothing flows by</text><text x="0.0" y="216.0" font-size="10.2" fill="#374151" font-weight="400">default; each disclosure needs</text><text x="0.0" y="228.0" font-size="10.2" fill="#374151" font-weight="400">prior consent.</text><text x="164.6" y="12.0" font-size="12" fill="#111827" font-weight="650">Shared</text><text x="314.6" y="12.0" font-size="10.8" fill="#111827" text-anchor="end" font-family="JetBrains Mono, monospace">51 of 198</text><rect x="164.6" y="20.0" width="150.0" height="132.0" fill="#F6FAF9" rx="4"/><line x1="210.6" y1="112" x2="268.6" y2="112" stroke="#374151" stroke-width="0.9" marker-start="url(#fkm-b)" marker-end="url(#fkm-a)"/><circle cx="239.6" cy="46.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="257.6" y="49.5" font-size="9.9" fill="#374151">Person</text><g transform="translate(248.6,27)" fill="none" stroke="#0F766E" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="2 1.2"><circle cx="3.5" cy="3.5" r="3"/><path d="M6.5 3.5h9M12.5 3.5v3M15 3.5v2.5"/></g><circle cx="194.6" cy="112.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="194.6" y="136.0" font-size="9.9" fill="#374151" text-anchor="middle">Providers</text><g transform="translate(189.1,105)" opacity="1"><path d="M0 0h8l3 3v11H0z" fill="#fff" stroke="#111827" stroke-width="0.8"/><path d="M8 0v3h3" fill="none" stroke="#111827" stroke-width="0.8"/><path d="M2 6h7M2 8.5h7M2 11h5" stroke="#111827" stroke-width="0.5"/></g><circle cx="284.6" cy="112.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="284.6" y="136.0" font-size="9.9" fill="#374151" text-anchor="middle">State</text><g transform="translate(279.1,105)" opacity="0.35"><path d="M0 0h8l3 3v11H0z" fill="#fff" stroke="#111827" stroke-width="0.8"/><path d="M8 0v3h3" fill="none" stroke="#111827" stroke-width="0.8"/><path d="M2 6h7M2 8.5h7M2 11h5" stroke="#111827" stroke-width="0.5"/></g><text x="310.6" y="147.0" font-size="9.9" fill="#374151" text-anchor="end">where one exists</text><text x="239.6" y="73.0" font-size="9.9" fill="#374151" text-anchor="middle">a working choice:</text><text x="239.6" y="84.0" font-size="9.9" fill="#374151" text-anchor="middle">opt-in, opt-out, blocking</text><text x="164.6" y="168.0" font-size="10.2" fill="#374151" font-weight="400">The system shares by default</text><text x="164.6" y="180.0" font-size="10.2" fill="#374151" font-weight="400">or by law, but the person has</text><text x="164.6" y="192.0" font-size="10.2" fill="#374151" font-weight="400">a working choice over who</text><text x="164.6" y="204.0" font-size="10.2" fill="#374151" font-weight="400">sees the record in care.</text><text x="329.2" y="12.0" font-size="12" fill="#111827" font-weight="650">State</text><text x="479.2" y="12.0" font-size="10.8" fill="#111827" text-anchor="end" font-family="JetBrains Mono, monospace">66 of 198</text><rect x="329.2" y="20.0" width="150.0" height="132.0" fill="#F6FAF9" rx="4"/><line x1="375.2" y1="112" x2="433.2" y2="112" stroke="#374151" stroke-width="0.9" marker-end="url(#fkm-a)"/><circle cx="404.2" cy="46.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="422.2" y="49.5" font-size="9.9" fill="#374151">Person</text><circle cx="359.2" cy="112.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="359.2" y="136.0" font-size="9.9" fill="#374151" text-anchor="middle">Providers</text><g transform="translate(353.7,105)" opacity="1"><path d="M0 0h8l3 3v11H0z" fill="#fff" stroke="#111827" stroke-width="0.8"/><path d="M8 0v3h3" fill="none" stroke="#111827" stroke-width="0.8"/><path d="M2 6h7M2 8.5h7M2 11h5" stroke="#111827" stroke-width="0.5"/></g><circle cx="449.2" cy="112.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="449.2" y="136.0" font-size="9.9" fill="#374151" text-anchor="middle">State</text><g transform="translate(443.7,105)" opacity="1"><path d="M0 0h8l3 3v11H0z" fill="#fff" stroke="#111827" stroke-width="0.8"/><path d="M8 0v3h3" fill="none" stroke="#111827" stroke-width="0.8"/><path d="M2 6h7M2 8.5h7M2 11h5" stroke="#111827" stroke-width="0.5"/></g><g transform="translate(458.2,93)" fill="none" stroke="#0F766E" stroke-width="1.6" stroke-linecap="round"><circle cx="3.5" cy="3.5" r="3" fill="#0F766E"/><path d="M6.5 3.5h9M12.5 3.5v3M15 3.5v2.5"/></g><text x="329.2" y="168.0" font-size="10.2" fill="#374151" font-weight="400">No working choice for the</text><text x="329.2" y="180.0" font-size="10.2" fill="#374151" font-weight="400">person. A live government-run</text><text x="329.2" y="192.0" font-size="10.2" fill="#374151" font-weight="400">national record holds the</text><text x="329.2" y="204.0" font-size="10.2" fill="#374151" font-weight="400">data by default.</text><text x="493.8" y="12.0" font-size="12" fill="#111827" font-weight="650">Institutional</text><text x="643.8" y="12.0" font-size="10.8" fill="#111827" text-anchor="end" font-family="JetBrains Mono, monospace">81 of 198</text><rect x="493.8" y="20.0" width="150.0" height="132.0" fill="#F6FAF9" rx="4"/><circle cx="568.8" cy="46.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="586.8" y="49.5" font-size="9.9" fill="#374151">Person</text><circle cx="523.8" cy="112.0" r="13" fill="#fff" stroke="#374151" stroke-width="0.8"/><text x="523.8" y="136.0" font-size="9.9" fill="#374151" text-anchor="middle">Providers</text><g transform="translate(518.3,105)" opacity="1"><path d="M0 0h8l3 3v11H0z" fill="#fff" stroke="#111827" stroke-width="0.8"/><path d="M8 0v3h3" fill="none" stroke="#111827" stroke-width="0.8"/><path d="M2 6h7M2 8.5h7M2 11h5" stroke="#111827" stroke-width="0.5"/></g><g transform="translate(532.8,93)" fill="none" stroke="#0F766E" stroke-width="1.6" stroke-linecap="round"><circle cx="3.5" cy="3.5" r="3" fill="#0F766E"/><path d="M6.5 3.5h9M12.5 3.5v3M15 3.5v2.5"/></g><circle cx="613.8" cy="112.0" r="13" fill="#fff" stroke="#D1D5DB" stroke-width="0.8"/><text x="613.8" y="136.0" font-size="9.9" fill="#6B7280" text-anchor="middle">State: none</text><text x="493.8" y="168.0" font-size="10.2" fill="#374151" font-weight="400">No working choice for the</text><text x="493.8" y="180.0" font-size="10.2" fill="#374151" font-weight="400">person. Records are held</text><text x="493.8" y="192.0" font-size="10.2" fill="#374151" font-weight="400">provider by provider; no live</text><text x="493.8" y="204.0" font-size="10.2" fill="#374151" font-weight="400">national record.</text><g transform="translate(0,240)" opacity="1"><path d="M0 0h8l3 3v11H0z" fill="#fff" stroke="#111827" stroke-width="0.8"/><path d="M8 0v3h3" fill="none" stroke="#111827" stroke-width="0.8"/><path d="M2 6h7M2 8.5h7M2 11h5" stroke="#111827" stroke-width="0.5"/></g><text x="16.0" y="250.0" font-size="9.9" fill="#374151">where the record sits by default</text><g transform="translate(205.07200000000003,243)" fill="none" stroke="#0F766E" stroke-width="1.6" stroke-linecap="round"><circle cx="3.5" cy="3.5" r="3" fill="#0F766E"/><path d="M6.5 3.5h9M12.5 3.5v3M15 3.5v2.5"/></g><text x="225.1" y="250.0" font-size="9.9" fill="#374151">decides who sees the record</text><g transform="translate(387.41400000000004,243)" fill="none" stroke="#0F766E" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="2 1.2"><circle cx="3.5" cy="3.5" r="3"/><path d="M6.5 3.5h9M12.5 3.5v3M15 3.5v2.5"/></g><text x="407.4" y="250.0" font-size="9.9" fill="#374151">a working choice only</text><line x1="537.7" y1="247.0" x2="555.7" y2="247.0" stroke="#374151" stroke-width="0.9"/><text x="559.7" y="250.0" font-size="9.9" fill="#374151">default flow</text><text x="0.0" y="266.0" font-size="8.6" fill="#6B7280">Counts: countries in each class, data as of 2026-10-02. Classes and anchors as in Section 2.3 (rubric v1.1, docs/RUBRIC_V1_1_ANCHORS.md); the wording here</text><text x="0.0" y="277.0" font-size="8.6" fill="#6B7280">is a short paraphrase. Source: Health Record Rights Index, SuperTruth.</text></svg>