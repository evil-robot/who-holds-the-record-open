<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 537" width="664" height="537" font-family="Inter, system-ui, sans-serif"><rect width="664" height="537" fill="#fff"/><line x1="0.0" y1="0.0" x2="206.0" y2="0.0" stroke="#0F766E" stroke-width="1.2"/><text x="0.0" y="15.0" font-size="12" fill="#0F766E" font-weight="700" font-family="JetBrains Mono, monospace">1</text><text x="14.0" y="15.0" font-size="12" fill="#111827" font-weight="650">Research</text><line x1="211.5" y1="10.0" x2="222.5" y2="10.0" stroke="#6B7280" stroke-width="0.9"/><path d="M223.5 10l-4 -2.6v5.2z" fill="#6B7280"/><text x="0.0" y="32.0" font-size="10.2" fill="#374151">One agent per country, in the</text><text x="0.0" y="44.4" font-size="10.2" fill="#374151">country's own languages; 198</text><text x="0.0" y="56.8" font-size="10.2" fill="#374151">countries.</text><text x="0.0" y="74.2" font-size="10.2" fill="#374151">Public sources only: laws, government</text><text x="0.0" y="86.6" font-size="10.2" fill="#374151">and regulators, court decisions,</text><text x="0.0" y="99.0" font-size="10.2" fill="#374151">published news.</text><text x="0.0" y="116.4" font-size="10.2" fill="#374151">The rubric requires every cited source</text><text x="0.0" y="128.8" font-size="10.2" fill="#374151">to be opened.</text><text x="0.0" y="146.2" font-size="10.2" fill="#374151">Claude Opus 5.5 through Claude Code,</text><text x="0.0" y="158.6" font-size="10.2" fill="#374151">30 September to 2 October 2026.</text><text x="0.0" y="176.0" font-size="10.2" fill="#374151">Output: a draft country file with 8</text><text x="0.0" y="188.4" font-size="10.2" fill="#374151">category scores, 0 to 100, each with a</text><text x="0.0" y="200.8" font-size="10.2" fill="#374151">summary and dated sources.</text><line x1="229.0" y1="0.0" x2="435.0" y2="0.0" stroke="#0F766E" stroke-width="1.2"/><text x="229.0" y="15.0" font-size="12" fill="#0F766E" font-weight="700" font-family="JetBrains Mono, monospace">2</text><text x="243.0" y="15.0" font-size="12" fill="#111827" font-weight="650">Cross-check</text><line x1="440.5" y1="10.0" x2="451.5" y2="10.0" stroke="#6B7280" stroke-width="0.9"/><path d="M452.5 10l-4 -2.6v5.2z" fill="#6B7280"/><text x="229.0" y="32.0" font-size="10.2" fill="#374151">A second agent session, same model</text><text x="229.0" y="44.4" font-size="10.2" fill="#374151">family.</text><text x="229.0" y="61.8" font-size="10.2" fill="#374151">Rubric anchors: each score compared</text><text x="229.0" y="74.2" font-size="10.2" fill="#374151">with the anchor band for its legal</text><text x="229.0" y="86.6" font-size="10.2" fill="#374151">situation.</text><text x="229.0" y="104.0" font-size="10.2" fill="#374151">Publisher classes: every cited</text><text x="229.0" y="116.4" font-size="10.2" fill="#374151">publisher reclassified.</text><line x1="458.0" y1="0.0" x2="664.0" y2="0.0" stroke="#0F766E" stroke-width="1.2"/><text x="458.0" y="15.0" font-size="12" fill="#0F766E" font-weight="700" font-family="JetBrains Mono, monospace">3</text><text x="472.0" y="15.0" font-size="12" fill="#111827" font-weight="650">Review and audit</text><text x="458.0" y="32.0" font-size="10.2" fill="#374151">Agent consistency audit: countries</text><text x="458.0" y="44.4" font-size="10.2" fill="#374151">with the same legal right compared.</text><text x="458.0" y="61.8" font-size="10.2" fill="#374151">The authors rule on every finding and</text><text x="458.0" y="74.2" font-size="10.2" fill="#374151">every proposed score change.</text><text x="458.0" y="91.6" font-size="10.2" fill="#374151">Published change log: every change,</text><text x="458.0" y="104.0" font-size="10.2" fill="#374151">with its reason.</text><line x1="0.0" y1="244.2" x2="206.0" y2="244.2" stroke="#0F766E" stroke-width="1.2"/><text x="0.0" y="259.2" font-size="12" fill="#0F766E" font-weight="700" font-family="JetBrains Mono, monospace">4</text><text x="14.0" y="259.2" font-size="12" fill="#111827" font-weight="650">Scoring</text><line x1="211.5" y1="254.2" x2="222.5" y2="254.2" stroke="#6B7280" stroke-width="0.9"/><path d="M223.5 254.20000000000005l-4 -2.6v5.2z" fill="#6B7280"/><text x="0.0" y="276.2" font-size="10.2" fill="#374151">Overall score: the weighted sum of the</text><text x="0.0" y="288.6" font-size="10.2" fill="#374151">eight category scores; weights sum to</text><text x="0.0" y="301.0" font-size="10.2" fill="#374151">100% (Table 1).</text><text x="0.0" y="318.4" font-size="10.2" fill="#374151">Five bands, to scale; countries in each:</text><rect x="0.0" y="326.4" width="50.5" height="12.0" fill="#AADDD4"/><text x="25.8" y="350.4" font-size="9.9" fill="#374151" text-anchor="middle">Poor</text><text x="25.8" y="362.4" font-size="10.2" fill="#111827" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">12</text><rect x="51.5" y="326.4" width="40.2" height="12.0" fill="#80C7BB"/><text x="72.1" y="350.4" font-size="9.9" fill="#374151" text-anchor="middle">Weak</text><text x="72.1" y="362.4" font-size="10.2" fill="#111827" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">111</text><rect x="92.7" y="326.4" width="40.2" height="12.0" fill="#50AEA0"/><text x="113.3" y="350.4" font-size="9.9" fill="#374151" text-anchor="middle">Mixed</text><text x="113.3" y="362.4" font-size="10.2" fill="#111827" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">66</text><rect x="133.9" y="326.4" width="40.2" height="12.0" fill="#0D9488"/><text x="154.5" y="350.4" font-size="9.9" fill="#374151" text-anchor="middle">Strong</text><text x="154.5" y="362.4" font-size="10.2" fill="#111827" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">9</text><rect x="175.1" y="326.4" width="29.9" height="12.0" fill="#0F766E"/><text x="206.0" y="376.4" font-size="9.9" fill="#374151" text-anchor="end">Leading</text><text x="206.0" y="388.4" font-size="10.2" fill="#111827" font-weight="600" text-anchor="end" font-family="JetBrains Mono, monospace">0</text><line x1="229.0" y1="244.2" x2="435.0" y2="244.2" stroke="#0F766E" stroke-width="1.2"/><text x="229.0" y="259.2" font-size="12" fill="#0F766E" font-weight="700" font-family="JetBrains Mono, monospace">5</text><text x="243.0" y="259.2" font-size="12" fill="#111827" font-weight="650">Testing</text><line x1="440.5" y1="254.2" x2="451.5" y2="254.2" stroke="#6B7280" stroke-width="0.9"/><path d="M452.5 254.20000000000005l-4 -2.6v5.2z" fill="#6B7280"/><text x="229.0" y="276.2" font-size="10.2" fill="#374151">Stability: 10,000 draws re-weight the</text><text x="229.0" y="288.6" font-size="10.2" fill="#374151">categories and perturb the scores; a</text><text x="229.0" y="301.0" font-size="10.2" fill="#374151">rank range for each country.</text><text x="229.0" y="318.4" font-size="10.2" fill="#374151">Second full reading of 43 countries:</text><text x="229.0" y="330.8" font-size="10.2" fill="#374151">ICC 0.94 on the overall score, 0.86</text><text x="229.0" y="343.2" font-size="10.2" fill="#374151">per cell.</text><text x="229.0" y="360.6" font-size="10.2" fill="#374151">Blind re-scoring of 64 sampled cells</text><text x="229.0" y="373.0" font-size="10.2" fill="#374151">(58 scorable): ICC 0.82.</text><text x="229.0" y="390.4" font-size="10.2" fill="#374151">Blind re-scoring of 136 cells from the</text><text x="229.0" y="402.8" font-size="10.2" fill="#374151">added countries (108 scorable): ICC</text><text x="229.0" y="415.2" font-size="10.2" fill="#374151">0.84.</text><text x="229.0" y="432.6" font-size="10.2" fill="#374151">Comparison with outside measures</text><text x="229.0" y="445.0" font-size="10.2" fill="#374151">(Section 6).</text><text x="229.0" y="462.4" font-size="10.2" fill="#374151">Links: 7,011 of 7,156 cited links open</text><text x="229.0" y="474.8" font-size="10.2" fill="#374151">on recheck, 2 October 2026 (US Eastern</text><text x="229.0" y="487.2" font-size="10.2" fill="#374151">time).</text><line x1="458.0" y1="244.2" x2="664.0" y2="244.2" stroke="#0F766E" stroke-width="1.2"/><text x="458.0" y="259.2" font-size="12" fill="#0F766E" font-weight="700" font-family="JetBrains Mono, monospace">6</text><text x="472.0" y="259.2" font-size="12" fill="#111827" font-weight="650">Publication</text><text x="458.0" y="276.2" font-size="10.2" fill="#374151">Scores and every source, as CSV and</text><text x="458.0" y="288.6" font-size="10.2" fill="#374151">JSON, CC BY 4.0.</text><text x="458.0" y="306.0" font-size="10.2" fill="#374151">198 one-page country briefs.</text><text x="458.0" y="323.4" font-size="10.2" fill="#374151">The paper.</text><text x="458.0" y="340.8" font-size="10.2" fill="#374151">Beside the scores, never in them: 446</text><text x="458.0" y="353.2" font-size="10.2" fill="#374151">published accounts from regulators,</text><text x="458.0" y="365.6" font-size="10.2" fill="#374151">courts and the news. They change no</text><text x="458.0" y="378.0" font-size="10.2" fill="#374151">score.</text><text x="0.0" y="514.6" font-size="8.6" fill="#6B7280">Method as in Section 3. Rubric v1.1. 198 countries, data as of 2026-10-02. Counts read from out/facts.json, analysis/robustness, analysis/reliability,</text><text x="0.0" y="525.6" font-size="8.6" fill="#6B7280">analysis/reliability2, analysis/testretest and analysis/url_check.csv. Source: Health Record Rights Index, SuperTruth.</text></svg>